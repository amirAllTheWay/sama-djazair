<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Star Style Tracker — presse mode</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <div class="eyebrow">Star Style Tracker · presse mode</div>
      <div class="masthead-row">
        <div class="masthead-copy">
          <h1>Les tenues des célébrités dans la presse</h1>
          <p class="subtitle">Les articles de la presse américaine sur les tenues de chaque star : le look, la marque, l'occasion.</p>
        </div>
        <div class="meta" id="meta">
          <span id="updated-at">Chargement…</span>
          <button id="refresh-btn" class="refresh-btn" type="button">Actualiser</button>
        </div>
      </div>
    </header>

    <div class="board" id="board">
      <p class="loading">Chargement des articles…</p>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
